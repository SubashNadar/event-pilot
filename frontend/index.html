    <script>
      /* Apply the saved theme before first paint, so dark mode never flashes light. */
      try { var t = localStorage.getItem('eventpilot.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); if (t === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
