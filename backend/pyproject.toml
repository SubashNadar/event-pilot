[project]
name = "event-pilot-backend"
version = "0.2.0"
description = "Event Pilot: FastAPI and LangGraph backend for the multi-agent event planner"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "aiosqlite>=0.20.0",
    "sse-starlette>=2.1.0",
    "langfuse>=5.0.0",
    "mcp>=1.18.0,<2.0.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "Pillow>=10.0",
    "python-pptx>=1.0.2",
    "reportlab>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
